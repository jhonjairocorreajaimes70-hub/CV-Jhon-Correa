  <main>
    <section class="container py-5">
      <p class="text-uppercase text-muted small mb-1">Hablemos</p>
      <h2 class="mb-0">Formulario de Contacto</h2>
      <hr class="w-25 my-3">
      <p class="text-secondary mb-4">Escríbeme y te responderé lo antes posible.</p>

      <form action="" method="post">
        <fieldset class="border p-4 rounded bg-light">
          <legend class="float-none w-auto px-3 fw-bold text-primary fs-5">Formulario de contacto</legend>
          
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" class="form-control" required>
          </div>
          
          <div class="mb-3">
            <label for="correo" class="form-label">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" class="form-control" required>
          </div>
          
          <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" class="form-control">
          </div>
          
          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje:</label>
            <textarea name="mensaje" id="mensaje" rows="5" class="form-control" required></textarea>
          </div>
          
          <div class="text-center pt-2">
            <button type="submit" class="btn btn-primary px-4">Enviar mensaje</button>
          </div>
        </fieldset>
      </form>
    </section>
  </main>
